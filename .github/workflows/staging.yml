name: Staging CD authorization

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-cd-authorization
  cancel-in-progress: false

jobs:
  authorize-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Authorize checked main commit for staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
      deployment: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the successful same-repository main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify all gates and publish signed staging authorization
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_CD_SIGNING_KEY: ${{ secrets.STAGING_CD_SIGNING_KEY }}
          STAGING_SCHEMA_VERSION: ${{ vars.STAGING_SCHEMA_VERSION }}
        run: python3 deploy/staging/cd_publish.py
