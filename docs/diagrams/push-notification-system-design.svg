<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1580" viewBox="0 0 2220 1580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="35" font-family="Arial, sans-serif" font-size="38" fill="#212529"><tspan x="60" dy="38">Push notification backend | Target architecture</tspan></text><text x="60" y="94" font-family="Arial, sans-serif" font-size="22" fill="#495057"><tspan x="60" dy="22">Multi-application / Android + iOS / FCM / PostgreSQL / Kafka    |    Status: 2026-11-05</tspan></text><rect x="60" y="205" width="300" height="145" rx="12" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/><text x="80" y="220" font-family="Arial, sans-serif" font-size="25" fill="#1864ab"><tspan x="80" dy="25">Admin panel</tspan></text><text x="80" y="266" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="80" dy="20">Separate frontend repository</tspan><tspan x="80" dy="26.0">Project-scoped staff access</tspan></text><rect x="1500" y="205" width="660" height="145" rx="12" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/><text x="1520" y="220" font-family="Arial, sans-serif" font-size="25" fill="#1864ab"><tspan x="1520" dy="25">Mobile applications</tspan></text><text x="1520" y="266" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="1520" dy="20">App A / App B / future apps</tspan><tspan x="1520" dy="26.0">Scoped identity, installation proof and token lifecycle</tspan></text><polyline points="210,350 210,430" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="365" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="65" dy="17">Draft / send</tspan><tspan x="65" dy="22.1">/ schedule</tspan></text><polyline points="1500,265 1410,265 1410,160 390,160 390,385 310,385 310,430" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="470" y="174" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="470" dy="17">Mobile API: enroll / refresh / logout / ownership changes; receipt ingestion is planned</tspan></text><rect x="60" y="430" width="300" height="200" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="80" y="445" font-family="Arial, sans-serif" font-size="25" fill="#2b8a3e"><tspan x="80" dy="25">1. Go API</tspan></text><text x="80" y="483" font-family="Arial, sans-serif" font-size="16" fill="#2b8a3e"><tspan x="80" dy="16">M02 / M03 / M04 foundations</tspan></text><text x="80" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="80" dy="20">Application isolation</tspan><tspan x="80" dy="26.0">DB-backed authorization</tspan><tspan x="80" dy="26.0">Atomic send acceptance</tspan></text><rect x="420" y="430" width="300" height="200" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="440" y="445" font-family="Arial, sans-serif" font-size="25" fill="#2b8a3e"><tspan x="440" dy="25">2. Outbox publisher</tspan></text><text x="440" y="483" font-family="Arial, sans-serif" font-size="16" fill="#2b8a3e"><tspan x="440" dy="16">M04 library; runtime open</tspan></text><text x="440" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="440" dy="20">Read durable send outbox</tspan><tspan x="440" dy="26.0">Bounded broker publication</tspan><tspan x="440" dy="26.0">Retain uncertain work</tspan></text><rect x="780" y="430" width="300" height="200" rx="12" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/><text x="800" y="445" font-family="Arial, sans-serif" font-size="25" fill="#1864ab"><tspan x="800" dy="25">3. Kafka</tspan></text><text x="800" y="483" font-family="Arial, sans-serif" font-size="16" fill="#1864ab"><tspan x="800" dy="16">Real local fixture tested; HA open</tspan></text><text x="800" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="800" dy="20">Scoped send-request event</tspan><tspan x="800" dy="26.0">Explicit source identity</tspan><tspan x="800" dy="26.0">At-least-once processing</tspan></text><rect x="1140" y="430" width="300" height="200" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1160" y="445" font-family="Arial, sans-serif" font-size="25" fill="#2b8a3e"><tspan x="1160" dy="25">4. Admission</tspan></text><text x="1160" y="483" font-family="Arial, sans-serif" font-size="16" fill="#2b8a3e"><tspan x="1160" dy="16">M05 library; runtime open</tspan></text><text x="1160" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="1160" dy="20">Validate event and scope</tspan><tspan x="1160" dy="26.0">Freeze audience snapshot</tspan><tspan x="1160" dy="26.0">Create delivery intents</tspan></text><rect x="1500" y="430" width="300" height="200" rx="12" fill="#fff3bf" stroke="#a66b00" stroke-width="2"/><text x="1520" y="445" font-family="Arial, sans-serif" font-size="25" fill="#a66b00"><tspan x="1520" dy="25">5. Delivery executor</tspan></text><text x="1520" y="483" font-family="Arial, sans-serif" font-size="16" fill="#a66b00"><tspan x="1520" dy="16">M06 planned</tspan></text><text x="1520" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="1520" dy="20">Per-device claim + lease</tspan><tspan x="1520" dy="26.0">Eligibility / rate / retry / TTL</tspan><tspan x="1520" dy="26.0">Persist provider outcomes</tspan></text><rect x="1860" y="430" width="300" height="200" rx="12" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/><text x="1880" y="445" font-family="Arial, sans-serif" font-size="25" fill="#1864ab"><tspan x="1880" dy="25">6. FCM</tspan></text><text x="1880" y="483" font-family="Arial, sans-serif" font-size="16" fill="#1864ab"><tspan x="1880" dy="16">Real integration gate open</tspan></text><text x="1880" y="516" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="1880" dy="20">Per-project credentials</tspan><tspan x="1880" dy="26.0">Android delivery</tspan><tspan x="1880" dy="26.0">APNs -&gt; iOS delivery</tspan></text><polyline points="720,530 780,530" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1080,530 1140,530" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1800,530 1860,530" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="970" y="650" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="970" dy="17">Commit snapshot before</tspan><tspan x="970" dy="22.1">advancing Kafka offset.</tspan></text><rect x="60" y="800" width="2100" height="205" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="80" y="815" font-family="Arial, sans-serif" font-size="25" fill="#2b8a3e"><tspan x="80" dy="25">PostgreSQL | Durable system of record</tspan></text><text x="80" y="853" font-family="Arial, sans-serif" font-size="16" fill="#2b8a3e"><tspan x="80" dy="16">Implemented foundations + planned M06/M07 tables and flows; atomic transactions enforce consistency</tspan></text><text x="80" y="886" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="80" dy="20">Per-application users, installations, encrypted addresses and immutable owner/binding generations</tspan><tspan x="80" dy="26.0">Campaigns, scheduling, idempotency keys, acceptance + audit + send outbox; audience snapshots + delivery intents</tspan><tspan x="80" dy="26.0">Source-aware quarantine and replay evidence; provider attempts, results, update outbox and receipt projections are planned</tspan></text><polyline points="210,630 210,800" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="230" y="710" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="230" dy="17">Acceptance</tspan><tspan x="230" dy="22.1">transaction</tspan></text><polyline points="570,800 570,630" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="590" y="723" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="590" dy="17">Pending outbox</tspan></text><polyline points="1290,630 1290,800" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1310" y="710" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="1310" dy="17">Snapshot</tspan><tspan x="1310" dy="22.1">+ intents</tspan></text><polyline points="1650,800 1650,630" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1670" y="703" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="1670" dy="17">Claim / load work</tspan></text><polyline points="1775,630 1775,800" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1795" y="753" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="1795" dy="17">Results</tspan></text><rect x="60" y="1150" width="660" height="205" rx="12" fill="#fff3bf" stroke="#a66b00" stroke-width="2"/><text x="80" y="1165" font-family="Arial, sans-serif" font-size="25" fill="#a66b00"><tspan x="80" dy="25">Scheduler and recovery</tspan></text><text x="80" y="1203" font-family="Arial, sans-serif" font-size="16" fill="#a66b00"><tspan x="80" dy="16">PARTIAL: tested libraries; process wiring and supervision open</tspan></text><text x="80" y="1236" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="80" dy="20">Promote due schedules; expire work under its deadline.</tspan><tspan x="80" dy="26.0">Dispatch outbox; recover QUEUED admission work.</tspan><tspan x="80" dy="26.0">Recover expired replay claims; provider recovery is M06.</tspan></text><rect x="780" y="1150" width="660" height="205" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="800" y="1165" font-family="Arial, sans-serif" font-size="25" fill="#2b8a3e"><tspan x="800" dy="25">Quarantine and operator replay</tspan></text><text x="800" y="1203" font-family="Arial, sans-serif" font-size="16" fill="#2b8a3e"><tspan x="800" dy="16">M05 libraries tested locally; operational activation open</tspan></text><text x="800" y="1236" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="800" dy="20">Persist rejected source positions before advancing offsets.</tspan><tspan x="800" dy="26.0">Scoped grant + step-up credential + audit + fenced claim.</tspan><tspan x="800" dy="26.0">Publication / expired-claim cleanup tested; CLI still open.</tspan></text><rect x="1500" y="1150" width="660" height="205" rx="12" fill="#fff3bf" stroke="#a66b00" stroke-width="2"/><text x="1520" y="1165" font-family="Arial, sans-serif" font-size="25" fill="#a66b00"><tspan x="1520" dy="25">Receipts, updates and statistics</tspan></text><text x="1520" y="1203" font-family="Arial, sans-serif" font-size="16" fill="#a66b00"><tspan x="1520" dy="16">M06 / M07 planned; live mobile contract verification open</tspan></text><text x="1520" y="1236" font-family="Arial, sans-serif" font-size="20" fill="#212529"><tspan x="1520" dy="20">Mobile -&gt; authenticated receipt API + delivery capability.</tspan><tspan x="1520" dy="26.0">Versioned result outbox -&gt; update stream / projection.</tspan><tspan x="1520" dy="26.0">Distinguish provider acceptance, receipt and open.</tspan></text><polyline points="390,1150 390,1005" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="410" y="1060" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="410" dy="17">Due work / recovery</tspan></text><polyline points="1110,1150 1110,1005" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1130" y="1060" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="1130" dy="17">Quarantine / replay evidence</tspan></text><polyline points="1830,1150 1830,1005" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="9 6"/><text x="1850" y="1060" font-family="Arial, sans-serif" font-size="17" fill="#495057"><tspan x="1850" dy="17">Receipt / projection transactions</tspan></text><text x="60" y="1400" font-family="Arial, sans-serif" font-size="21" fill="#212529"><tspan x="60" dy="21">Legend: green = foundations tested locally; amber = planned work or incomplete runtime; blue = external systems.</tspan></text><text x="60" y="1440" font-family="Arial, sans-serif" font-size="19" fill="#495057"><tspan x="60" dy="19">Solid arrows = foundation flow; dashed arrows = planned flow. All boxes represent logical responsibilities, not mandatory microservices.</tspan></text><text x="60" y="1480" font-family="Arial, sans-serif" font-size="19" fill="#495057"><tspan x="60" dy="19">Production gates: runtime wiring, real mobile/auth/Firebase/APNs, Kafka HA/security, observability, load/restore tests and controlled cutover.</tspan></text><text x="60" y="1515" font-family="Arial, sans-serif" font-size="19" fill="#495057"><tspan x="60" dy="19">No end-to-end exactly-once guarantee. A broker/provider acknowledgement does not prove device delivery. Redis is not the correctness authority.</tspan></text></svg>
