<svg xmlns="http://www.w3.org/2000/svg" width="2660" height="1750" viewBox="0 0 2660 1750"><defs><marker id="e2e8f0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/></marker><marker id="7dd3e8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#7dd3e8" stroke-width="1.5"/></marker><marker id="c4a3f5" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#c4a3f5" stroke-width="1.5"/></marker><marker id="86d6a2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#86d6a2" stroke-width="1.5"/></marker><marker id="f2cc80" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#f2cc80" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#10151f"/><text x="40" y="25" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="42" fill="#e2e8f0"><tspan x="40" dy="42">PUSH NOTIFICATIONS  /  MULTI-APPLICATION BACKEND</tspan></text><text x="42" y="90" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="25" fill="#a8b3c7"><tspan x="42" dy="25">Target architecture  •  Android + iOS  •  05 Nov 2026</tspan></text><path d="M 464,390 Q 1280.0,389 2096,390 Q 2110,390 2110,404 L 2110,1356 Q 2110,1370 2096,1370 Q 1280.0,1371 464,1370 Q 450,1370 450,1356 L 450,404 Q 450,390 464,390" fill="#171f2c" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="12 9"/><text x="530" y="410" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#e2e8f0"><tspan x="530" dy="27">GO BACKEND  /  LOGICAL RESPONSIBILITIES</tspan></text><path d="M 34,490 Q 195.0,489 356,490 Q 370,490 370,504 L 370,656 Q 370,670 356,670 Q 195.0,671 34,670 Q 20,670 20,656 L 20,504 Q 20,490 34,490" fill="#142b36" stroke="#7dd3e8" stroke-width="2.5"/><text x="44" y="527.35" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#7dd3e8"><tspan x="44" dy="27">ADMIN PORTAL</tspan><tspan x="44" dy="35.1">• Separate web repository</tspan><tspan x="44" dy="35.1">• Project-scoped staff</tspan></text><path d="M 34,1120 Q 195.0,1119 356,1120 Q 370,1120 370,1134 L 370,1296 Q 370,1310 356,1310 Q 195.0,1311 34,1310 Q 20,1310 20,1296 L 20,1134 Q 20,1120 34,1120" fill="#142b36" stroke="#7dd3e8" stroke-width="2.5"/><text x="44" y="1162.35" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#7dd3e8"><tspan x="44" dy="27">MOBILE APPS</tspan><tspan x="44" dy="35.1">• App A / App B / ...</tspan><tspan x="44" dy="35.1">• Scoped identity + proof</tspan></text><path d="M 1114,170 Q 1310.0,169 1506,170 Q 1520,170 1520,184 L 1520,331 Q 1520,345 1506,345 Q 1310.0,346 1114,345 Q 1100,345 1100,331 L 1100,184 Q 1100,170 1114,170" fill="#30291b" stroke="#f2cc80" stroke-width="2.5"/><text x="1124" y="204.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#f2cc80"><tspan x="1124" dy="27">KAFKA</tspan><tspan x="1124" dy="35.1">• Durable send requests</tspan><tspan x="1124" dy="35.1">• Explicit source identity</tspan></text><path d="M 534,500 Q 720.0,499 906,500 Q 920,500 920,514 L 920,661 Q 920,675 906,675 Q 720.0,676 534,675 Q 520,675 520,661 L 520,514 Q 520,500 534,500" fill="#142b36" stroke="#7dd3e8" stroke-width="2.5"/><text x="544" y="534.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#7dd3e8"><tspan x="544" dy="27">NOTIFICATION API</tspan><tspan x="544" dy="35.1">• Auth + application scope</tspan><tspan x="544" dy="35.1">• Draft / send / schedule</tspan></text><path d="M 534,810 Q 720.0,809 906,810 Q 920,810 920,824 L 920,971 Q 920,985 906,985 Q 720.0,986 534,985 Q 520,985 520,971 L 520,824 Q 520,810 534,810" fill="#30291b" stroke="#f2cc80" stroke-width="2.5"/><text x="544" y="844.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#f2cc80"><tspan x="544" dy="27">OUTBOX PUBLISHER</tspan><tspan x="544" dy="35.1">• Reads committed work</tspan><tspan x="544" dy="35.1">• Publishes with broker ack</tspan></text><path d="M 1114,500 Q 1310.0,499 1506,500 Q 1520,500 1520,514 L 1520,661 Q 1520,675 1506,675 Q 1310.0,676 1114,675 Q 1100,675 1100,661 L 1100,514 Q 1100,500 1114,500" fill="#272139" stroke="#c4a3f5" stroke-width="2.5"/><text x="1124" y="534.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#c4a3f5"><tspan x="1124" dy="27">ADMISSION WORKER</tspan><tspan x="1124" dy="35.1">• Validate + deduplicate</tspan><tspan x="1124" dy="35.1">• Freeze audience + intents</tspan></text><path d="M 1654,810 Q 1850.0,809 2046,810 Q 2060,810 2060,824 L 2060,971 Q 2060,985 2046,985 Q 1850.0,986 1654,985 Q 1640,985 1640,971 L 1640,824 Q 1640,810 1654,810" fill="#272139" stroke="#c4a3f5" stroke-width="2.5"/><text x="1664" y="844.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#c4a3f5"><tspan x="1664" dy="27">DELIVERY EXECUTOR</tspan><tspan x="1664" dy="35.1">• Claim per-device work</tspan><tspan x="1664" dy="35.1">• Rate / retry / deadline</tspan></text><path d="M 534,1130 Q 720.0,1129 906,1130 Q 920,1130 920,1144 L 920,1296 Q 920,1310 906,1310 Q 720.0,1311 534,1310 Q 520,1310 520,1296 L 520,1144 Q 520,1130 534,1130" fill="#142b36" stroke="#7dd3e8" stroke-width="2.5"/><text x="544" y="1167.35" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#7dd3e8"><tspan x="544" dy="27">SCHEDULER / RECOVERY</tspan><tspan x="544" dy="35.1">• Promote due campaigns</tspan><tspan x="544" dy="35.1">• Resume durable work</tspan></text><path d="M 1044,1130 Q 1545.0,1129 2046,1130 Q 2060,1130 2060,1144 L 2060,1296 Q 2060,1310 2046,1310 Q 1545.0,1311 1044,1310 Q 1030,1310 1030,1296 L 1030,1144 Q 1030,1130 1044,1130" fill="#172e26" stroke="#86d6a2" stroke-width="2.5"/><text x="1054" y="1149.8" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#86d6a2"><tspan x="1054" dy="27">POSTGRESQL  /  DURABLE STATE</tspan><tspan x="1054" dy="35.1">• App-isolated users, installations, bindings and campaigns</tspan><tspan x="1054" dy="35.1">• Send keys + audit + outbox; audience snapshots + delivery intents</tspan><tspan x="1054" dy="35.1">• Attempt outcomes, quarantine / replay evidence, receipts + statistics</tspan></text><path d="M 2214,810 Q 2400.0,809 2586,810 Q 2600,810 2600,824 L 2600,971 Q 2600,985 2586,985 Q 2400.0,986 2214,985 Q 2200,985 2200,971 L 2200,824 Q 2200,810 2214,810" fill="#272139" stroke="#c4a3f5" stroke-width="2.5"/><text x="2224" y="844.85" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#c4a3f5"><tspan x="2224" dy="27">FIREBASE / FCM</tspan><tspan x="2224" dy="35.1">• Per-project credentials</tspan><tspan x="2224" dy="35.1">• Provider acknowledgement</tspan></text><path d="M 2214,1130 Q 2400.0,1129 2586,1130 Q 2600,1130 2600,1144 L 2600,1296 Q 2600,1310 2586,1310 Q 2400.0,1311 2214,1310 Q 2200,1310 2200,1296 L 2200,1144 Q 2200,1130 2214,1130" fill="#272139" stroke="#c4a3f5" stroke-width="2.5"/><text x="2224" y="1167.35" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#c4a3f5"><tspan x="2224" dy="27">MOBILE DEVICES</tspan><tspan x="2224" dy="35.1">• Android via FCM</tspan><tspan x="2224" dy="35.1">• iOS via FCM -&gt; APNs</tspan></text><polyline points="370,575 520,575" fill="none" stroke="#7dd3e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7dd3e8)"/><text x="377" y="505" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#7dd3e8"><tspan x="377" dy="24">Send /</tspan><tspan x="377" dy="31.200000000000003">schedule</tspan></text><polyline points="370,1215 410,1215 410,745 710,745 710,675" fill="none" stroke="#7dd3e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7dd3e8)"/><text x="50" y="870" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#7dd3e8"><tspan x="50" dy="24">Installations + token lifecycle</tspan><tspan x="50" dy="31.200000000000003">Receipts / engagement (planned)</tspan></text><polyline points="920,590 1000,590 1000,1060 1180,1060 1180,1130" fill="none" stroke="#7dd3e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7dd3e8)"/><text x="1020" y="735" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#7dd3e8"><tspan x="1020" dy="24">Atomic acceptance</tspan><tspan x="1020" dy="31.200000000000003">+ send outbox</tspan></text><polyline points="1030,1170 970,1170 970,1030 720,1030 720,985" fill="none" stroke="#86d6a2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#86d6a2)"/><text x="535" y="1055" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#86d6a2"><tspan x="535" dy="24">Read pending outbox</tspan></text><polyline points="520,895 480,895 480,255 1100,255" fill="none" stroke="#f2cc80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#f2cc80)"/><text x="530" y="285" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#f2cc80"><tspan x="530" dy="24">Publish send request</tspan></text><polyline points="1310,345 1310,500" fill="none" stroke="#f2cc80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#f2cc80)"/><text x="1330" y="355" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#f2cc80"><tspan x="1330" dy="24">Consume</tspan></text><polyline points="1310,675 1310,1130" fill="none" stroke="#c4a3f5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4a3f5)"/><text x="1330" y="815" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#c4a3f5"><tspan x="1330" dy="24">Commit snapshot</tspan><tspan x="1330" dy="31.200000000000003">+ delivery intents</tspan><tspan x="1330" dy="31.200000000000003">then advance offset</tspan></text><polyline points="1760,1130 1760,985" fill="none" stroke="#86d6a2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#86d6a2)"/><text x="1550" y="1030" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#86d6a2"><tspan x="1550" dy="24">Claim intents</tspan></text><polyline points="1940,985 1940,1130" fill="none" stroke="#86d6a2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#86d6a2)"/><text x="1960" y="1020" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#86d6a2"><tspan x="1960" dy="24">Store</tspan><tspan x="1960" dy="31.200000000000003">results</tspan></text><polyline points="2060,895 2200,895" fill="none" stroke="#c4a3f5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4a3f5)"/><text x="2075" y="850" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#c4a3f5"><tspan x="2075" dy="24">Submit</tspan></text><polyline points="2400,985 2400,1130" fill="none" stroke="#c4a3f5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4a3f5)"/><text x="2420" y="1040" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#c4a3f5"><tspan x="2420" dy="24">Deliver</tspan></text><polyline points="920,1240 1030,1240" fill="none" stroke="#7dd3e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7dd3e8)"/><text x="520" y="1420" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#7dd3e8"><tspan x="520" dy="24">Mobile receipts use the authenticated API + per-delivery capability (planned).</tspan></text><path d="M 1654,500 Q 1850.0,499 2046,500 Q 2060,500 2060,514 L 2060,661 Q 2060,675 2046,675 Q 1850.0,676 1654,675 Q 1640,675 1640,661 L 1640,514 Q 1640,500 1654,500" fill="#19241f" stroke="#86d6a2" stroke-width="2.5"/><text x="1662" y="520" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#86d6a2"><tspan x="1662" dy="24">ISOLATION BOUNDARY</tspan><tspan x="1662" dy="31.200000000000003">Every project owns its data,</tspan><tspan x="1662" dy="31.200000000000003">staff grants and FCM routing.</tspan><tspan x="1662" dy="31.200000000000003">No global token namespace.</tspan></text><text x="40" y="1530" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="27" fill="#e2e8f0"><tspan x="40" dy="27">IMPLEMENTATION SNAPSHOT</tspan></text><text x="40" y="1580" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#86d6a2"><tspan x="40" dy="24">Tested locally: scope + installation lifecycle; acceptance / outbox; admission; quarantine + replay libraries.</tspan></text><text x="40" y="1625" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="24" fill="#f2cc80"><tspan x="40" dy="24">Still open: process wiring + replay CLI; FCM executor; receipts / statistics; production verification.</tspan></text><text x="40" y="1680" font-family="Chalkboard SE, Comic Sans MS, cursive" font-size="22" fill="#a8b3c7"><tspan x="40" dy="22">Arrows show target contracts, not deployment readiness. Provider accepted ≠ device received ≠ opened.</tspan></text></svg>
