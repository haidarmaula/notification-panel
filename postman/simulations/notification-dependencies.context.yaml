purpose:
  stands_in_for: FCM HTTP v1 send/error and synthetic service-account OAuth subsets; no real Google authentication, APNs or devices.
  unblocks: Dependency smoke, route-bound transport and file-credential HTTP tests; not real provider acceptance.
assumptions:
  - id: send-error-envelope
    status: supported
    claim: Firebase documents message names on acceptance and FCM-specific registration/quota/unavailable errors.
    reason: Fixture shapes come from primary Firebase documentation and pinned SDK parsing.
    verification: Documentation and Firebase Go v4.21.0 Send/handleFCMError inspected; actual SDK fixture tests returned expected accepted/unregistered/quota/unavailable outcomes. This does not validate a real Firebase project.
    source: https://firebase.google.com/docs/cloud-messaging/error-codes; https://firebase.google.com/docs/reference/fcm/rest/v1/projects.messages/send; postman/contracts/fcm-fixture.openapi.yaml
    updated_at: '2026-11-02'
  - id: actual-fcm-delivery
    status: unknown
    claim: The production project accepts the application's Android/iOS payloads and delivers through APNs.
    reason: Project/app/APNs/credentials/mobile configuration is unverified; a fixture cannot establish this.
    verification: No real provider/device call made. Requires authorized test-project/device pilot.
    source: docs/analysis/cutover-readiness.md
    updated_at: '2026-11-02'
  - id: current-provider-wiring
    status: contradicted
    claim: Production FCMProvider is compatible with this single-message Send fixture.
    reason: Existing FCMProvider uses SendAll; fixture targets the proposed Send executor and SDK dependency smoke only.
    verification: Adapter source inspected; application worker/adapter is not executed by this harness.
    source: internal/features/notifications/fcm_provider.go; docs/adr/adr-04-provider-selection.md
    updated_at: '2026-11-02'
  - id: sdk-physical-retry-count
    status: supported
    claim: One SDK v4.21.0 Send issued five physical requests under the fixture 503 response and Retry-After zero.
    reason: Real SDK execution and simulation request events agree; one logical call is not necessarily one HTTP quota unit.
    verification: Dependency smoke passed; log contained 503 five times over about seven seconds. Fixture behavior does not establish provider retry timing or delivery.
    source: tests/integration/dependencies_test.go; scripts/integration.sh; postman/mocks/fcm/default.js
    updated_at: '2026-11-02'
  - id: caller-deadline
    status: supported
    claim: In the fixture scenario the SDK caller stopped by its deadline rather than waiting for the delayed server response.
    reason: Actual SDK test measured about 100 ms while the fixture response was delayed two seconds.
    verification: Tagged smoke test and request logs passed; no inference about whether a real provider accepted a timed-out request.
    source: tests/integration/dependencies_test.go; postman/mocks/fcm/default.js
    updated_at: '2026-11-02'
  - id: scoped-payload-sdk-serialization
    status: supported
    claim: The pinned SDK submits schema-v1 scoped payloads using FID and registration-token targets for Android and iOS through the local fixture.
    reason: The real payload builder and receipt signer feed messaging.Send; the fixture requires scope fields, receipt-token version and platform expiry serialization.
    verification: Four platform/address combinations pass, and the test verifier validates the unchanged capability. No real project credentials, APNs or devices are exercised.
    source: tests/integration/receipt_payload_test.go; internal/pushpayload/payload.go; docs/specs/m06-receipt-payload.md
    updated_at: '2026-11-05'
  - id: guarded-fcm-physical-attempt
    status: supported
    claim: The route-bound FCM transport makes one base HTTP attempt per used permit in the local acceptance, rejection, 503 and timeout scenarios.
    reason: The real pinned SDK runs through the transport guard and a restricted loopback rewrite; SDK retries cannot make a second physical call under the same record.
    verification: On 2026-11-05, TestFCMTransportAgainstSimulation passed with race detection for Android/iOS token and FID, typed unregistered, quota, 503 and timeout. Each case asserts one base request; simulation logs show the corresponding HTTP statuses. The unchanged dependency test still makes five 503 requests without the guard. No real OAuth, Firebase permissions, APNs or devices were tested.
    source: internal/fcm/client_integration_test.go; internal/fcm/transport.go; scripts/integration.sh; docs/analysis/m06-fcm-transport-verification.md
    updated_at: '2026-11-05'
  - id: service-account-oauth-library-exchange
    status: supported
    claim: Protected-file credential parsing feeds the pinned cloud auth 2LO library into a synchronous cached exchange before an actual FCM SDK send in local simulation.
    reason: The test invokes the production source/parser and library, with private exact-URL loopback transports for OAuth and FCM. The OAuth fixture checks serialized grant and issuer/audience/scope; unit tests separately verify the RSA assertion signature.
    verification: On 2026-11-05 the synthetic successful exchange supplied two accepted SDK sends using one credential HTTP call. Invalid-grant and caller-timeout cases made no FCM request. No real key, Google key-registry validation, OAuth acceptance, target IAM or APNs/device delivery was exercised. The public protected-path constructor is tested separately in an offline disposable root-owned container.
    source: internal/fcm/credentials_integration_test.go; internal/fcm/credentials_test.go; postman/mocks/oauth/default.js; postman/contracts/oauth-fixture.openapi.yaml; docs/analysis/m06-fcm-credentials-verification.md
    updated_at: '2026-11-05'
  - id: db-authorized-device-submission
    status: supported
    claim: A copied acknowledged reservation submits once, and post-credential authority or payload changes block the scoped SDK send in the local scenarios.
    reason: Real PostgreSQL transactions and the actual SDK pass through the final authorization callback and fixed loopback simulation. The private shared consumption bit and commit acknowledgement gate remain independent of transport permits.
    verification: On 2026-11-05 the focused race suite passed copied concurrent proof, ordinary driver, holds/lineage/lease/attempt/observation/user/binding/owner/payload changes and lost prepare/final-check commit acknowledgement. Denied final checks had zero physical FCM calls and retained one charged attempt. No production delivery or complete result/recovery protocol was exercised.
    source: tests/integration/submission_test.go; internal/dispatch/submission.go; internal/fcm/transport.go; docs/analysis/m06-submission-verification.md
    updated_at: '2026-11-05'
