global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
rule_files: [/etc/prometheus/kafka-rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: hello-kafka
    static_configs:
      - targets: [b1:9404, b2:9404, b3:9404]
        labels: {environment: fixture, cluster: fixture, role: broker}
      - targets: [c1:9404, c2:9404, c3:9404]
        labels: {environment: fixture, cluster: fixture, role: controller}
